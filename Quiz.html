<!DOCTYPE html>
<html>
<head>
  <title>Simple Quiz</title>
</head>
<body>

  <h2 id="question">Question will appear here</h2>

  <button id="answer1" onclick="checkAnswer(this.innerText)"></button><br><br>
  <button id="answer2" onclick="checkAnswer(this.innerText)"></button><br><br>
  <button id="answer3" onclick="checkAnswer(this.innerText)"></button><br><br>

  <h3>Score: <span id="showScore">0</span></h3>

  <script src="script.js"></script>

  <script>
    // Get elements
var getQuestion = document.getElementById("question");
var getAnswer1 = document.getElementById("answer1");
var getAnswer2 = document.getElementById("answer2");
var getAnswer3 = document.getElementById("answer3");
var getScore = document.getElementById("showScore");


// Quiz data
var quizQuestions = [
  {
    question: "Which planet is known as the Red Planet?",
    answer1: "Venus",
    answer2: "Mars",
    answer3: "Jupiter",
    correctAnswer: "Mars",
  },
  {
    question: "What is the largest ocean on Earth?",
    answer1: "Atlantic Ocean",
    answer2: "Pacific Ocean",
    answer3: "Indian Ocean",
    correctAnswer: "Pacific Ocean",
  },
  {
    question: "What gas do plants absorb during photosynthesis?",
    answer1: "Carbon Dioxide",
    answer2: "Oxygen",
    answer3: "Nitrogen",
    correctAnswer: "Carbon Dioxide",
  },
];

var questionId = 0;
var score = 0;

// Load first question
function loadQuestion() {
  getQuestion.innerText = quizQuestions[questionId].question;
  getAnswer1.innerText = quizQuestions[questionId].answer1;
  getAnswer2.innerText = quizQuestions[questionId].answer2;
  getAnswer3.innerText = quizQuestions[questionId].answer3;
  getScore.innerText = score;
}

// Check answer
function checkAnswer(selectedAnswer) {
  let correct = quizQuestions[questionId].correctAnswer;

  if (selectedAnswer === correct) {
    score++;
    alert("Correct!");
  } else {
    alert("Wrong!");
  }

  getScore.innerText = score;
  nextQuestion();
}

// Move to next question
function nextQuestion() {
  questionId++;

  if (questionId >= quizQuestions.length) {
    alert("Quiz finished! Final score: " + score);
    return;
  }

  loadQuestion();
}

// Start quiz
loadQuestion();

  </script>


</body>
</html>
